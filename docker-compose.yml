services:

  mysql:
    image: mysql:8.4
    container_name: tech_nova_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: tech_nova
      MYSQL_USER: tech_nova
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - tech_nova_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: tech_nova_app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/tech_nova
      DB_USERNAME: tech_nova
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8084:8084"


volumes:
  tech_nova_mysql_data: